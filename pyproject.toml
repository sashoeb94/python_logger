[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[project]
name = "python_logger"
version = "1.0.0"
description = "Generic library for Python logging and exception handling"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[tool.uv.build-backend]
module-name = "python_logger"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
